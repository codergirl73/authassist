# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: authassist
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: APP_ENV
        value: demo
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_API_KEY
        sync: false   # set in the Render dashboard
      - key: TAVILY_API_KEY
        sync: false
