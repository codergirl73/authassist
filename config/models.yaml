# Nemotron model IDs on Nebius Token Factory (confirmed with scripts/list_models.py, 2026-10-27).
# extra_body.chat_template_kwargs.enable_thinking=false turns off hidden reasoning for roles that only
# need a direct structured answer; with it on, Nano spent its entire token budget thinking and
# returned empty content.
# Not used: Nemotron-3-Nano-Omni and Nemotron-Nano-V2-12b are dedicated-endpoint only (no public
# endpoint), so Nemotron 3.5 Super VL is the vision model.
vision:
  model: "nvidia/Nemotron-3.5-Super-VL"
  temperature: 0.0
  max_tokens: 4000
  extra_body: { chat_template_kwargs: { enable_thinking: false } }
fast:
  model: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
  temperature: 0.0
  max_tokens: 3000
  extra_body: { chat_template_kwargs: { enable_thinking: false } }
reasoning:
  model: "nvidia/Nemotron-3-Ultra-550b-a55b"
  temperature: 0.1
  max_tokens: 8000
fallbacks:
  reasoning: "nvidia/nemotron-3-super-120b-a12b"
  fast: "nvidia/nemotron-3-super-120b-a12b"
